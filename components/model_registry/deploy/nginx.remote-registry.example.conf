# Registry proxy container only: protect BOTH the internal inference API and browser proxy
# upstream with TLS and an IP allowlist. Replace all example addresses and paths.
# The CVAT ingress strips /model-registry/ and proxies only UI/static/api requests;
# the CVAT gateway uses this HTTPS origin directly for /internal/... requests.
# Attach this proxy container to the manager's Docker network. For a standalone
# registryctl project this is normally mr-<MR_INSTANCE>_default. Publish port 8443
# only from this TLS proxy, restricted to the CVAT hosts below; publish no manager
# port. model-registry resolves inside that Docker network, not on the host.

server {
    listen 8443 ssl;
    server_name registry.example.internal;
    ssl_certificate /etc/ssl/registry/fullchain.pem;
    ssl_certificate_key /etc/ssl/registry/privkey.pem;

    # Include the actual CVAT gateway egress IP and CVAT HTTPS proxy IP if different.
    allow 192.0.2.10;
    deny all;

    location / {
        client_max_body_size 2050m;
        client_body_timeout 210s;
        proxy_pass http://model-registry:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
