# Add these locations INSIDE the existing CVAT HTTPS server {}.
# Keep its CVAT location / and certificate configuration. Do not create another
# server with the same server_name. With local Traefik routing already reachable
# through the existing proxy, these additional locations are unnecessary.
#
# Run this Nginx proxy in a container attached to the manager's Docker network
# (normally MR_CVAT_NETWORK for a local deployment). model-registry resolves on
# that network; the manager does not publish a host port. A host-side Nginx process
# cannot use this example unchanged. Prefer the existing CVAT Traefik route.
# For a remote manager, replace
# proxy_pass with https://registry.example.internal:8443 and configure verified
# upstream TLS as illustrated in operations.md. Preserve the browser's Origin.

location = /model-registry {
    return 308 /model-registry/;
}

# The manager's /internal API, /health and generated API documentation are not
# public routes. Only the UI, its static files and authenticated browser API pass.
location ~ "^/model-registry/(?:$|(?:api|static)/)" {
    client_max_body_size 2050m;
    client_body_timeout 210s;
    rewrite ^/model-registry/(.*)$ /$1 break;
    proxy_pass http://model-registry:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location /model-registry/ {
    return 404;
}
