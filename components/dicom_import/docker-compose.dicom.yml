services:
  cvat_server:
    environment:
      CVAT_DICOM_IMPORT_ENABLED: '1'
      CVAT_DICOM_MAX_UPLOAD_BYTES: ${CVAT_DICOM_MAX_UPLOAD_BYTES:-1099511627776}
      CVAT_DICOM_MAX_UPLOAD_FILES: ${CVAT_DICOM_MAX_UPLOAD_FILES:-100000}
      CVAT_DICOM_MAX_EXPANDED_BYTES: ${CVAT_DICOM_MAX_EXPANDED_BYTES:-1099511627776}
      CVAT_DICOM_IMPORT_TIMEOUT: ${CVAT_DICOM_IMPORT_TIMEOUT:-86400}
  cvat_worker_import:
    environment:
      CVAT_DICOM_IMPORT_ENABLED: '1'
      CVAT_DICOM_MAX_UPLOAD_BYTES: ${CVAT_DICOM_MAX_UPLOAD_BYTES:-1099511627776}
      CVAT_DICOM_MAX_UPLOAD_FILES: ${CVAT_DICOM_MAX_UPLOAD_FILES:-100000}
      CVAT_DICOM_MAX_EXPANDED_BYTES: ${CVAT_DICOM_MAX_EXPANDED_BYTES:-1099511627776}
      CVAT_DICOM_IMPORT_TIMEOUT: ${CVAT_DICOM_IMPORT_TIMEOUT:-86400}
