# SPDX-License-Identifier: MIT
metadata:
  name: pth-sam2-interactor
  namespace: nuclio
  annotations:
    name: SAM2 (GPU)
    type: interactor
    version: '2'
    spec: '[]'
    min_pos_points: '1'
    min_neg_points: '0'
    startswith_box: 'true'
    startswith_box_optional: 'true'
    help_message: Select an object with positive points; exclude regions with negative
      points. Optional box prompt. GPU inference returns a full CVAT mask.
spec:
  runtime: python:3.11
  eventTimeout: 120s
  minReplicas: 1
  maxReplicas: 1
  build:
    baseImage: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    directives:
      preCopy:
      - kind: ENV
        value: DEBIAN_FRONTEND=noninteractive
      - kind: ENV
        value: NVIDIA_VISIBLE_DEVICES=all
      - kind: ENV
        value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - kind: ENV
        value: SAM2_BUILD_CUDA=0
      - kind: WORKDIR
        value: /opt/nuclio
      - kind: RUN
        value: apt-get update && apt-get install -y --no-install-recommends git curl
          ca-certificates && rm -rf /var/lib/apt/lists/*
      - kind: RUN
        value: python -m pip install --no-cache-dir "torch==2.6.0" "torchvision==0.21.0"
          --index-url https://download.pytorch.org/whl/cu124
      - kind: RUN
        value: python -m pip install --no-cache-dir --no-build-isolation "numpy==1.26.4"
          "Pillow==11.3.0" "opencv-python-headless==4.11.0.86" "torch==2.6.0" "torchvision==0.21.0"
          "hydra-core==1.3.2" "iopath==0.1.10" "tqdm==4.67.1" "git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"
      - kind: RUN
        value: mkdir -p /opt/nuclio/checkpoints && curl --fail --location --retry
          3 https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_small.pt
          -o /opt/nuclio/checkpoints/sam2.1_hiera_small.pt && sha256sum /opt/nuclio/checkpoints/sam2.1_hiera_small.pt
          > /opt/nuclio/checkpoints/SHA256SUMS && python -m pip freeze > /opt/nuclio/build-requirements.txt
      - kind: RUN
        value: python -c "import sys, torch; assert sys.version_info[:2] == (3, 11),
          sys.version; assert torch.__version__.split('+')[0] == '2.6.0', torch.__version__;
          assert torch.version.cuda == '12.4', torch.version.cuda"
    image: cvat.sam2-interactor:2b90b9f5-gpu
  triggers:
    http:
      kind: http
      maxWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
        disablePortPublishing: true
  resources:
    limits:
      nvidia.com/gpu: 1
  platform:
    attributes:
      restartPolicy:
        name: unless-stopped
      mountMode: volume
  handler: main:handler
  description: SAM2 (GPU)
